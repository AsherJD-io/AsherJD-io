<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Asher, data engineer: data platforms, pipelines and decision intelligence">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e4e9f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f8fafc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="#f8fafc"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="620" height="400" fill="url(#fade)"/>

  <!-- left rule accent -->
  <rect x="64" y="104" width="4" height="120" rx="2" fill="#2563eb"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
    <text x="92" y="150" font-size="58" font-weight="700" letter-spacing="1" fill="#0f172a">ASHER</text>
    <text x="94" y="186" font-size="17" font-weight="600" letter-spacing="5.5" fill="#2563eb">DATA ENGINEER</text>
    <line x1="94" y1="208" x2="470" y2="208" stroke="#cbd5e1" stroke-width="1"/>
    <text x="94" y="236" font-size="15" fill="#475569">Data platforms &#183; Pipelines &#183; Decision intelligence</text>
  </g>

  <!-- evidence graph motif -->
  <circle cx="1000" cy="205" r="130" fill="url(#halo)"/>
  <g stroke="#e2e8f0" stroke-width="1" fill="none">
    <circle cx="1000" cy="205" r="118"/>
    <circle cx="1000" cy="205" r="74" stroke-dasharray="3 5"/>
  </g>

  <g stroke="#cbd5e1" stroke-width="1.1" fill="none">
    <path d="M905 138 L962 112"/>
    <path d="M962 112 L1046 150"/>
    <path d="M905 138 L944 208"/>
    <path d="M944 208 L1000 205"/>
    <path d="M1000 205 L1046 150"/>
    <path d="M1000 205 L1090 232"/>
    <path d="M944 208 L900 292"/>
    <path d="M900 292 L972 300"/>
    <path d="M972 300 L1000 205"/>
    <path d="M972 300 L1062 318"/>
    <path d="M1062 318 L1090 232"/>
  </g>

  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.4">
    <circle cx="905" cy="138" r="4.5"/>
    <circle cx="1046" cy="150" r="4.5"/>
    <circle cx="944" cy="208" r="4.5"/>
    <circle cx="1090" cy="232" r="4.5"/>
    <circle cx="900" cy="292" r="4.5"/>
    <circle cx="1062" cy="318" r="4.5"/>
  </g>

  <g fill="#ffffff" stroke="#2563eb" stroke-width="2.2">
    <circle cx="962" cy="112" r="5.5"/>
    <circle cx="972" cy="300" r="5.5"/>
    <circle cx="1000" cy="205" r="7"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3" fill="#64748b">
    <text x="64" y="360">SOURCE</text>
    <text x="196" y="360">NORMALIZE</text>
    <text x="368" y="360">CLUSTER</text>
    <text x="500" y="360">EVIDENCE</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M104 352 H170"/>
    <path d="M236 352 H342"/>
    <path d="M408 352 H474"/>
    <path d="M540 352 H566"/>
  </g>
</svg>
