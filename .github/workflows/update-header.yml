name: Update profile header

# Regenerates assets/header.gif so the GitHub statistics in it stay current.
# The generator lives in this repo because the workflow has to run it; the
# README is not touched, only the GIF is committed back.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: profile-header
  cancel-in-progress: true

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render header
        env:
          # Read-only by default; the stats helper only queries public profile data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit updated header
        run: |
          if git diff --quiet -- assets/header.gif; then
            echo "header.gif unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.gif
          git commit -m "chore: refresh profile header stats"
          git push
